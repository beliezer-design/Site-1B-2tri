<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carroças & Carretas Artesanais</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        /* Configurações Globais */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4efe6; /* Tom palha / pergaminho */
            color: #2b1d0c;
            font-family: 'Roboto', sans-serif;
            line-height: 1.6;
        }

        /* Cabeçalho */
        header {
            background-color: #3b2314; /* Madeira escura */
            color: #e8d8c8;
            padding: 40px 20px;
            text-align: center;
            border-bottom: 6px solid #8c5a2b; /* Detalhe em madeira clara */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #f3e5ab;
        }

        header p {
            font-size: 1.1rem;
            font-style: italic;
            opacity: 0.9;
        }
