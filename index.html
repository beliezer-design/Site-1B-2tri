<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Farm 🗿</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), 
                              url('https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExMTV5eXQ4NzA3dzN5ZGp2MndhdWhrYm13Z3o3bHo0eWJob3JkbnY2NSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/qwr614iHK9bqdXfeF8/giphy.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: rgba(24, 24, 28, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            color: #e2e8f0;
        }

        .subtitle {
            color: #a0aec0;
            font-size: 0.9rem;
            margin-top: 8px;
            margin-bottom: 24px;
        }

        .aura-box {
            background: rgba(9, 9, 11, 0.8);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            border: 1px solid #3f3f46;
        }

        #aura-counter {
            display: block;
            font-size: 3rem;
            font-weight: bold;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .aura-box small {
            color: #71717a;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }

        button {
            background: #27272a;
            color: #ffffff;
            border: 1px solid #52525b;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        button:hover {
            background: #3f3f46;
            border-color: #a1a1aa;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .status {
            margin-top: 16px;
            font-size: 0.85rem;
            color: #a1a1aa;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>+10.000 AURA</h1>
        <p class="subtitle">O teu olhar frio e calculista fala por ti.</p>
        
        <div class="aura-box">
            <span id="aura-counter">0</span>
            <small>PONTOS DE AURA</small>
        </div>

        <button id="farm-btn" onclick="farmarAura()">Manter o Foco 🗿🍷</button>
        
        <p id="status-text" class="status">Modo Sigma Desativado...</p>
    </div>

    <script>
        let aura = 0;

        function farmarAura() {
            aura += 1000;
            
            const counterElement = document.getElementById("aura-counter");
            counterElement.innerText = aura.toLocaleString("pt-BR");

            const statusElement = document.getElementById("status-text");

            if (aura >= 10000) {
                statusElement.innerText = "Aura Inabalável. O silêncio domina o recinto. 🗿🍷";
                statusElement.style.color = "#38bdf8";
            } else if (aura >= 5000) {
                statusElement.innerText = "Presença marcante detetada... Ninguém ousa interromper.";
                statusElement.style.color = "#a78bfa";
            } else {
                statusElement.innerText = "A farmar aura em silêncio...";
            }
        }
    </script>
</body>
</html>
